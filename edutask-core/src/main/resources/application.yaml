server:
  port: 8081

spring:
  application:
    name: edutask-core

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8085/realms/edutask}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8085/realms/edutask/protocol/openid-connect/certs}

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/edutask-db}
    username: ${SPRING_DATASOURCE_USERNAME:user}
    password: ${SPRING_DATASOURCE_PASSWORD:mysecretpassword}

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: none
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 10
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 120000
        request.timeout.ms: 30000
        linger.ms: 10
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:edutask-core-task-generation}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: ru.usernamedrew.edutaskcommon.event.generation
        isolation.level: read_committed
    listener:
      missing-topics-fatal: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

edutask:
  kafka:
    partitions: ${EDUTASK_KAFKA_PARTITIONS:3}
    replication-factor: ${EDUTASK_KAFKA_REPLICATION_FACTOR:1}
    consumer-concurrency: ${EDUTASK_KAFKA_CONSUMER_CONCURRENCY:2}
    retry:
      max-attempts: ${EDUTASK_KAFKA_RETRY_MAX_ATTEMPTS:3}
      backoff: ${EDUTASK_KAFKA_RETRY_BACKOFF:2s}
    topics:
      task-generation-requests: ${TASK_GENERATION_REQUESTS_TOPIC:task-generation-requests}
      task-generation-responses: ${TASK_GENERATION_RESPONSES_TOPIC:task-generation-responses}
      task-generation-requests-dlt: ${TASK_GENERATION_REQUESTS_DLT_TOPIC:task-generation-requests.dlt}
      task-generation-responses-dlt: ${TASK_GENERATION_RESPONSES_DLT_TOPIC:task-generation-responses.dlt}

  generation:
    default-temperature: ${EDUTASK_GENERATION_DEFAULT_TEMPERATURE:0.3}
    kafka-send-timeout: ${EDUTASK_GENERATION_KAFKA_SEND_TIMEOUT:10s}
    sse-timeout: ${EDUTASK_GENERATION_SSE_TIMEOUT:10m}
    schema-version: ${EDUTASK_GENERATION_SCHEMA_VERSION:1}

  security:
    keycloak:
      client-id: ${KEYCLOAK_CLIENT_ID:edutask-frontend}
