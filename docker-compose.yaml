services:
  frontend:
    build:
      context: ./edutask-frontend
      args:
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-http://localhost:8085}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-edutask}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-edutask-frontend}
    container_name: edutask-frontend
    environment:
      API_UPSTREAM: http://host.docker.internal:8080
    ports:
      - "3000:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.1
    container_name: edutask-keycloak
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "8085:8080"
    volumes:
      - edutask_keycloak_data:/opt/keycloak/data

  postgres:
    image: postgres:16-alpine
    container_name: edutask-postgres
    environment:
      POSTGRES_DB: edutask-db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: mysecretpassword
    ports:
      - "5432:5432"
    volumes:
      - edutask_postgres_data:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:3.9.0
    container_name: edutask-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    volumes:
      - edutask_kafka_data:/var/lib/kafka/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.5
    container_name: edutask-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - edutask_elasticsearch_data:/usr/share/elasticsearch/data

  judge0-server:
    image: judge0/judge0:latest
    container_name: edutask-judge0-server
    profiles:
      - judge
    env_file:
      - judge0.conf
    ports:
      - "2358:2358"
    privileged: true
    depends_on:
      - judge0-postgres
      - judge0-redis
    restart: unless-stopped

  judge0-worker:
    image: judge0/judge0:latest
    container_name: edutask-judge0-worker
    profiles:
      - judge
    command: ["./scripts/workers"]
    env_file:
      - judge0.conf
    privileged: true
    depends_on:
      - judge0-server
      - judge0-postgres
      - judge0-redis
    restart: unless-stopped

  judge0-postgres:
    image: postgres:16.2
    container_name: edutask-judge0-postgres
    profiles:
      - judge
    env_file:
      - judge0.conf
    volumes:
      - edutask_judge0_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  judge0-redis:
    image: redis:7.2.4
    container_name: edutask-judge0-redis
    profiles:
      - judge
    command: [
      "bash", "-c",
      "docker-entrypoint.sh --appendonly no --requirepass \"$${REDIS_PASSWORD}\""
    ]
    env_file:
      - judge0.conf
    restart: unless-stopped

  judge-worker:
    build:
      context: .
      dockerfile: edutask-judge-worker/Dockerfile
    container_name: edutask-judge-worker
    profiles:
      - judge
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      JUDGE0_BASE_URL: http://judge0-server:2358
      EDUTASK_JUDGE_WORKER_CONSUMER_CONCURRENCY: 1
      EDUTASK_JUDGE_WORKER_MAX_CONCURRENT_SUBMISSIONS: 1
      JUDGE0_DEFAULT_CPU_TIME_LIMIT: 2
      JUDGE0_DEFAULT_MEMORY_LIMIT: 131072
    ports:
      - "8083:8083"
    depends_on:
      - kafka
      - judge0-server
      - judge0-worker

volumes:
  edutask_keycloak_data:
  edutask_postgres_data:
  edutask_kafka_data:
  edutask_elasticsearch_data:
  edutask_judge0_postgres_data:
